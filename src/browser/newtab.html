<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0a0a0a;
      background-image: radial-gradient(circle at 50% 40%, #161616 0%, #0a0a0a 75%);
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 600px;
      padding: 0 20px;
      margin-top: -40px;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(12px) scale(0.99);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .brand {
      font-size: 48px;
      font-weight: 300;
      color: #e5e5e5;
      letter-spacing: -0.5px;
      margin-bottom: 30px;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.16), 0 0 50px rgba(255, 255, 255, 0.05);
      transition: text-shadow 0.3s ease;
    }

    .brand:hover {
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.28), 0 0 60px rgba(255, 255, 255, 0.1);
    }

    .search-wrapper {
      width: 500px;
      max-width: 100%;
      height: 48px;
      border-radius: 24px;
      background: #1e1e1e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      padding: 0 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-wrapper:hover {
      border-color: rgba(255, 255, 255, 0.16);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
    }

    .search-wrapper:focus-within {
      border-color: rgba(255, 255, 255, 0.28);
      background: #222222;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    .search-icon {
      width: 18px;
      height: 18px;
      color: #777777;
      margin-right: 12px;
      flex-shrink: 0;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .search-wrapper:focus-within .search-icon {
      color: #bbbbbb;
    }

    .search-input {
      flex: 1;
      height: 100%;
      border: none;
      background: transparent;
      outline: none;
      color: #f0f0f0;
      font-size: 15px;
      font-weight: 400;
      font-family: inherit;
    }

    .search-input::placeholder {
      color: #606060;
    }

    /* Shortcuts Grid: 4x2 */
    .shortcuts-grid {
      display: grid;
      grid-template-columns: repeat(4, 80px);
      grid-gap: 20px;
      margin-top: 36px;
    }

    .shortcut-tile {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      background: #1e1e1e;
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #a0a0a0;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                  background 0.2s ease,
                  border-color 0.2s ease,
                  box-shadow 0.2s ease,
                  color 0.2s ease;
    }

    .shortcut-tile:hover {
      transform: translateY(-5px);
      background: #282828;
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.6), 0 0 14px rgba(255, 255, 255, 0.04);
      color: #ffffff;
    }

    .shortcut-tile:active {
      transform: translateY(-2px);
    }

    .shortcut-icon {
      width: 26px;
      height: 26px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      fill: currentColor;
    }

    .shortcut-icon svg {
      width: 100%;
      height: 100%;
    }

    .shortcut-label {
      font-size: 11px;
      font-weight: 400;
      color: inherit;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 72px;
      letter-spacing: 0.2px;
    }

    /* Clock */
    .clock {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 15px;
      font-weight: 400;
      color: #555555;
      letter-spacing: 1.5px;
      font-variant-numeric: tabular-nums;
      opacity: 0;
      animation: fadeIn 0.8s ease 0.3s forwards;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand">Lit</div>

    <div class="search-wrapper">
      <svg class="search-icon" id="searchSubmitBtn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="text"
        class="search-input"
        id="searchInput"
        placeholder="Search DuckDuckGo or type a URL"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        autofocus
      />
    </div>

    <div class="shortcuts-grid">
      <!-- 1. Google -->
      <a href="https://www.google.com" class="shortcut-tile" title="Google">
        <div class="shortcut-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
          </svg>
        </div>
        <span class="shortcut-label">Google</span>
      </a>

      <!-- 2. YouTube -->
      <a href="https://www.youtube.com" class="shortcut-tile" title="YouTube">
        <div class="shortcut-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" fill="#FF0000"/>
          </svg>
        </div>
        <span class="shortcut-label">YouTube</span>
      </a>

      <!-- 3. GitHub -->
      <a href="https://github.com" class="shortcut-tile" title="GitHub">
        <div class="shortcut-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
        </div>
        <span class="shortcut-label">GitHub</span>
      </a>

      <!-- 4. Reddit -->
      <a href="https://www.reddit.com" class="shortcut-tile" title="Reddit">
        <div class="shortcut-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.703zM9.25 12C8.56 12 8 12.56 8 13.25c0 .688.56 1.25 1.25 1.25.688 0 1.25-.562 1.25-1.25 0-.69-.562-1.25-1.25-1.25zm5.5 0c-.688 0-1.25.56-1.25 1.25 0 .688.562 1.25 1.25 1.25.69 0 1.25-.562 1.25-1.25 0-.69-.56-1.25-1.25-1.25zm-5.465 4.316a.48.48 0 0 0-.07.674c.642.768 1.666 1.184 2.785 1.184 1.118 0 2.143-.416 2.784-1.184a.48.48 0 1 0-.737-.614c-.453.542-1.222.842-2.047.842-.826 0-1.595-.3-2.048-.842a.48.48 0 0 0-.667-.06z" fill="#FF4500"/>
          </svg>
        </div>
        <span class="shortcut-label">Reddit</span>
      </a>

      <!-- 5. Twitter / X -->
      <a href="https://x.com" class="shortcut-tile" title="Twitter / X">
        <div class="shortcut-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
        </div>
        <span class="shortcut-label">Twitter</span>
      </a>

      <!-- 6. Wikipedia -->
      <a href="https://www.wikipedia.org" class="shortcut-tile" title="Wikipedia">
        <div class="shortcut-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12.09 13.124l2.42-6.52h1.49l3.54 9.172h-1.63l-.86-2.348h-3.48l-.83 2.348h-1.59l3.07-7.91-2.13 5.258zm2.49-1.42h2.52l-1.24-3.51-1.28 3.51zm-7.65 4.068l3.66-9.172h1.72l-4.21 10.368-1.57-.02-3.53-10.348h1.76l2.17 9.172zm-2.02-9.172H3.32l-.85 2.128h.93c.48 0 .76-.23.95-.71l.56-1.418zm14.83 0h-1.59l-.85 2.128h.93c.48 0 .76-.23.95-.71l.56-1.418z"/>
          </svg>
        </div>
        <span class="shortcut-label">Wikipedia</span>
      </a>

      <!-- 7. Stack Overflow -->
      <a href="https://stackoverflow.com" class="shortcut-tile" title="Stack Overflow">
        <div class="shortcut-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.986 21.865v-6.404h2.134V24H1.844v-8.539h2.13v6.404h15.012zM6.111 19.731H16.85v-2.137H6.111v2.137zm.259-4.852l10.48 2.179.43-2.094-10.48-2.18-.43 2.095zm1.26-4.992l9.67 4.636.924-1.933-9.671-4.637-.923 1.934zm2.842-4.831l8.033 7.079 1.4-1.614-8.032-7.078-1.4 1.613zM14.54.223l-1.743 1.24 5.991 8.91 1.743-1.24L14.54.223z" fill="#F48024"/>
          </svg>
        </div>
        <span class="shortcut-label">Stack Overflow</span>
      </a>

      <!-- 8. Gmail -->
      <a href="https://mail.google.com" class="shortcut-tile" title="Gmail">
        <div class="shortcut-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z" fill="#EA4335"/>
          </svg>
        </div>
        <span class="shortcut-label">Gmail</span>
      </a>
    </div>
  </div>

  <div class="clock" id="clock">00:00</div>

  <script>
    // Search input handling
    var searchInput = document.getElementById('searchInput');
    var searchSubmitBtn = document.getElementById('searchSubmitBtn');

    function performSearch() {
      var query = (searchInput.value || '').trim();
      if (!query) return;

      // If query contains a dot and no spaces -> treat as URL
      if (query.indexOf('.') !== -1 && query.indexOf(' ') === -1) {
        var url = query;
        if (!/^https?:\/\//i.test(url)) {
          url = 'https://' + url;
        }
        window.location.href = url;
      } else {
        // Search DuckDuckGo
        window.location.href = 'https://duckduckgo.com/?q=' + encodeURIComponent(query);
      }
    }

    searchInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        performSearch();
      }
    });

    searchSubmitBtn.addEventListener('click', function() {
      performSearch();
    });

    // Auto-focus search input on load
    window.addEventListener('DOMContentLoaded', function() {
      searchInput.focus();
    });

    // Clock updater: HH:MM updated every second
    function updateClock() {
      var now = new Date();
      var hours = String(now.getHours()).padStart(2, '0');
      var minutes = String(now.getMinutes()).padStart(2, '0');
      var clockEl = document.getElementById('clock');
      if (clockEl) {
        clockEl.textContent = hours + ':' + minutes;
      }
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
