<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lit Browser</title>
  <link rel="stylesheet" href="styles.css">
  <style id="lit-core-styles"></style>
</head>
<body>

  <!-- ========================================================================
       MODERN UNIFIED BROWSER CHROME (~86px height)
       ======================================================================== -->
  <header id="browser-chrome">

    <!-- 1. TOP BAR: Branding, Omni-Capsule, Actions & Window Controls (44px) -->
    <div id="top-bar">
      <!-- Left: Lit Brand Mark -->
      <div id="brand-island">
        <div id="app-branding" title="Lit Browser">
          <div class="flame-glow"></div>
          <svg class="app-icon" viewBox="0 0 24 24" fill="none">
            <path d="M12 2C10.5 5 7 8 7 12a5 5 0 0 0 10 0c0-2-1-4-2-5.5-.5 2-2 3-3 3-1 0-1.5-1-1-2.5 1-3 1.5-4 1-5z" fill="url(#lit-flame-grad)"/>
            <defs>
              <linearGradient id="lit-flame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#a855f7"/>
                <stop offset="50%" stop-color="#6366f1"/>
                <stop offset="100%" stop-color="#f97316"/>
              </linearGradient>
            </defs>
          </svg>
          <span class="app-title">Lit</span>
        </div>
      </div>

      <!-- Center: Floating Omni-Capsule (URL, Navigation & Status) -->
      <div id="omni-capsule-wrapper">
        <div id="omni-capsule">
          <!-- Navigation Buttons -->
          <div id="nav-buttons">
            <button class="nav-btn" id="btn-back" title="Go Back (Alt+Left)" disabled>
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </button>
            <button class="nav-btn" id="btn-forward" title="Go Forward (Alt+Right)" disabled>
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
            <button class="nav-btn" id="btn-reload" title="Reload (Ctrl+R)">
              <svg class="reload-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
              </svg>
            </button>
          </div>

          <div class="capsule-divider"></div>

          <!-- Security Indicator -->
          <span id="security-indicator" class="secure" title="Secure Connection (HTTPS)">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="3" ry="3"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>

          <!-- Smart URL Input -->
          <div id="url-input-box">
            <input type="text" id="url-input" placeholder="Search or type a URL..." autocomplete="off" spellcheck="false" />
          </div>

          <!-- Capsule Actions (Star & Adblock Badge) -->
          <div id="url-actions">
            <button class="star-btn" id="btn-bookmark-star" title="Bookmark page (Ctrl+D)">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
              </svg>
            </button>

            <!-- Lit Shield Ad & Tracker Blocker Badge -->
            <div class="adblock-badge" id="badge-adblock" title="Lit Shield — Ad & Tracker Blocker Active">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              </svg>
              <span class="adblock-count">0</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Right: Toolbar Actions & Window Controls -->
      <div id="right-island">
        <div id="toolbar-actions">
          <button class="action-pill-btn" id="btn-downloads" title="Downloads">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
          </button>
          <button class="action-pill-btn" id="btn-menu" title="Menu">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="1.5"></circle>
              <circle cx="12" cy="5" r="1.5"></circle>
              <circle cx="12" cy="19" r="1.5"></circle>
            </svg>
          </button>
        </div>

        <div class="island-separator"></div>

        <!-- Window Controls -->
        <div id="window-controls">
          <button class="win-btn" id="btn-minimize" title="Minimize">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <button class="win-btn" id="btn-maximize" title="Maximize">
            <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <rect x="5" y="5" width="14" height="14" rx="3" ry="3"></rect>
            </svg>
          </button>
          <button class="win-btn win-close" id="btn-close" title="Close">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- 2. BOTTOM BAR: Floating Pill Tab Strip (38px) -->
    <div id="tab-strip-row">
      <div id="tab-bar">
        <div id="tabs-container">
          <!-- Tabs dynamically injected here -->
        </div>
        <button id="new-tab-btn" class="new-tab-capsule" title="New Tab (Ctrl+T)">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>New</span>
        </button>
      </div>
    </div>

    <!-- Shimmering Loading Progress Indicator -->
    <div id="loading-bar">
      <div id="loading-bar-inner"></div>
    </div>
  </header>

  <!-- Content Container (WebContentsView occupies this view area) -->
  <main id="content-area"></main>

  <!-- ========================================================================
       FLOATING DYNAMIC ISLANDS & OVERLAYS
       ======================================================================== -->

  <!-- Password Save Dynamic Island Banner -->
  <aside id="password-save-banner" class="dynamic-island">
    <div class="island-icon-box">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="3" ry="3"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        <circle cx="12" cy="16" r="1.5"></circle>
      </svg>
    </div>
    <div class="island-content">
      <div class="island-title" id="pass-banner-title">Save Password?</div>
      <div class="island-subtitle" id="pass-banner-subtitle">user@example.com</div>
    </div>
    <div class="island-actions">
      <button class="island-btn island-btn-secondary" id="pass-banner-dismiss">Never</button>
      <button class="island-btn island-btn-primary" id="pass-banner-save">Save</button>
    </div>
  </aside>

  <!-- Autofill Suggestion Popup -->
  <div id="autofill-popup" class="floating-glass-popup">
    <div class="popup-header">
      <span class="popup-title">Autofill Profile</span>
      <span class="popup-badge">Lit Vault</span>
    </div>
    <div id="autofill-profiles-container" class="popup-list"></div>
  </div>

  <!-- Find in Page Floating Capsule -->
  <div id="find-bar" class="floating-find-capsule">
    <div class="find-input-wrap">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="find-input" placeholder="Find in page..." spellcheck="false" autocomplete="off" />
    </div>
    <span id="find-count" class="find-counter">0/0</span>
    <button class="find-action-btn" id="find-prev-btn" title="Previous (Shift+Enter)">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
    </button>
    <button class="find-action-btn" id="find-next-btn" title="Next (Enter)">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <button class="find-action-btn find-close" id="find-close-btn" title="Close (Escape)">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <!-- Downloads Floating Bar -->
  <div id="downloads-bar" class="floating-downloads-island">
    <div class="downloads-bar-header">
      <span class="downloads-title">Downloads</span>
      <button id="btn-close-downloads-bar" class="downloads-close-btn">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="downloads-container"></div>
  </div>

  <!-- Slide-Out Glassmorphism Panels -->
  <div id="panels-container">
    <div id="panel-backdrop"></div>

    <!-- Bookmarks Panel -->
    <aside id="bookmarks-panel" class="side-glass-panel">
      <div class="panel-header">
        <div class="panel-title-wrap">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <h2>Bookmarks</h2>
        </div>
        <button class="panel-close-btn" id="close-bookmarks-panel">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="panel-search-wrap">
        <input type="text" id="bookmarks-search-input" class="panel-search-input" placeholder="Search saved bookmarks..." />
      </div>
      <div id="bookmarks-list" class="panel-list"></div>
    </aside>

    <!-- History Panel -->
    <aside id="history-panel" class="side-glass-panel">
      <div class="panel-header">
        <div class="panel-title-wrap">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <h2>History</h2>
        </div>
        <div class="panel-header-actions">
          <button class="panel-action-btn text-btn" id="clear-history-btn">Clear All</button>
          <button class="panel-close-btn" id="close-history-panel">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div class="panel-search-wrap">
        <input type="text" id="history-search-input" class="panel-search-input" placeholder="Search browsing history..." />
      </div>
      <div id="history-list" class="panel-list"></div>
    </aside>
  </div>

  <!-- Dropdown App Menu -->
  <div id="app-menu" class="floating-glass-menu">
    <div class="menu-item" data-action="new-tab">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>New Tab</span>
      <span class="menu-shortcut">Ctrl+T</span>
    </div>
    <div class="menu-item" data-action="bookmarks">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span>Bookmarks</span>
      <span class="menu-shortcut">Ctrl+D</span>
    </div>
    <div class="menu-item" data-action="history">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>History</span>
      <span class="menu-shortcut">Ctrl+H</span>
    </div>
    <div class="menu-item" data-action="downloads">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      <span>Downloads</span>
      <span class="menu-shortcut">Ctrl+J</span>
    </div>
    <div class="menu-item" data-action="find">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Find in Page</span>
      <span class="menu-shortcut">Ctrl+F</span>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item" data-action="settings">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Settings</span>
    </div>
    <div class="menu-item" data-action="about">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <span>About Lit</span>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Main Renderer Script -->
  <script src="app.js"></script>
</body>
</html>
