<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      user-select: none;
    }

    /* Ambient Subtle Wireframe Circle */
    .ambient-circle {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.04);
      pointer-events: none;
    }

    .ambient-circle-inner {
      position: absolute;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.03);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 640px;
      padding: 0 20px;
      margin-top: -20px;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Minimal Technical Clock */
    .clock-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 2px;
    }

    .clock-display {
      font-size: 56px;
      font-weight: 200;
      letter-spacing: -2px;
      color: #ffffff;
    }

    .seconds-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #eb0029;
      box-shadow: 0 0 8px rgba(235, 0, 41, 0.6);
      animation: blink 1s infinite alternate;
    }

    @keyframes blink {
      0% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    .date-display {
      font-size: 11px;
      font-weight: 600;
      color: #666666;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 26px;
    }

    /* Brand Header: Nothing Industrial Style */
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .brand-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #ffffff;
      padding: 3px 8px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #111111;
    }

    .brand-sub {
      font-size: 11px;
      color: #666666;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    /* Nothing Capsule Search Bar */
    .search-capsule {
      width: 100%;
      height: 48px;
      border-radius: 9999px;
      background: #111111;
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      padding: 0 8px 0 18px;
      gap: 12px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-capsule:hover {
      border-color: rgba(255, 255, 255, 0.25);
      background: #141414;
    }

    .search-capsule:focus-within {
      border-color: #ffffff;
      background: #161616;
      box-shadow: 0 0 0 1px #ffffff, 0 12px 32px rgba(0, 0, 0, 0.7);
    }

    .search-icon {
      width: 16px;
      height: 16px;
      color: #666666;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      height: 100%;
      border: none;
      background: transparent;
      outline: none;
      color: #ffffff;
      font-size: 14px;
      font-weight: 450;
      letter-spacing: -0.1px;
    }

    .search-input::placeholder {
      color: #555555;
    }

    .search-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #ffffff;
      border: none;
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .search-btn:hover {
      background: #e0e0e0;
      transform: scale(1.05);
    }

    .search-btn:active {
      transform: scale(0.95);
    }

    /* Engine Selector Pills */
    .engine-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      margin-bottom: 30px;
    }

    .engine-pill {
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #666666;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: all 0.15s;
    }

    .engine-pill:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .engine-pill.active {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    /* Shortcuts Grid: Nothing Capsule Style */
    .shortcuts-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
    }

    .shortcut-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 9999px;
      background: #0d0d0d;
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .shortcut-card:hover {
      background: #181818;
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    .shortcut-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #333333;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .shortcut-card:hover .shortcut-dot {
      background: #eb0029;
      box-shadow: 0 0 6px rgba(235, 0, 41, 0.6);
    }

    .shortcut-name {
      font-size: 11px;
      font-weight: 550;
      letter-spacing: 0.2px;
      color: #888888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .shortcut-card:hover .shortcut-name {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="ambient-circle"></div>
  <div class="ambient-circle-inner"></div>

  <div class="container">
    <!-- Clock & Date -->
    <div class="clock-row">
      <div class="clock-display" id="live-clock">12:00</div>
      <div class="seconds-dot"></div>
    </div>
    <div class="date-display" id="live-date">Friday, November 20</div>

    <!-- Brand Tag -->
    <div class="brand-wrap">
      <span class="brand-tag">LIT // (01)</span>
      <span class="brand-sub">PURE PERFORMANCE</span>
    </div>

    <!-- Search Capsule (Defaults to Google) -->
    <form class="search-capsule" id="search-form">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="search-input" class="search-input" placeholder="Search Google or enter address..." autofocus autocomplete="off" spellcheck="false" />
      <button type="submit" class="search-btn" title="Search">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </form>

    <!-- Engine Pills (Google Active by Default) -->
    <div class="engine-pills">
      <button type="button" class="engine-pill active" data-engine="google">Google</button>
      <button type="button" class="engine-pill" data-engine="youtube">YouTube</button>
      <button type="button" class="engine-pill" data-engine="github">GitHub</button>
      <button type="button" class="engine-pill" data-engine="reddit">Reddit</button>
      <button type="button" class="engine-pill" data-engine="duckduckgo">DuckDuckGo</button>
    </div>

    <!-- Shortcuts Grid: Nothing Capsule Style -->
    <div class="shortcuts-grid">
      <a class="shortcut-card" href="https://www.google.com">
        <div class="shortcut-dot"></div>
        <span class="shortcut-name">Google</span>
      </a>
      <a class="shortcut-card" href="https://www.youtube.com">
        <div class="shortcut-dot"></div>
        <span class="shortcut-name">YouTube</span>
      </a>
      <a class="shortcut-card" href="https://github.com">
        <div class="shortcut-dot"></div>
        <span class="shortcut-name">GitHub</span>
      </a>
      <a class="shortcut-card" href="https://www.reddit.com">
        <div class="shortcut-dot"></div>
        <span class="shortcut-name">Reddit</span>
      </a>
      <a class="shortcut-card" href="https://x.com">
        <div class="shortcut-dot"></div>
        <span class="shortcut-name">X</span>
      </a>
      <a class="shortcut-card" href="https://www.wikipedia.org">
        <div class="shortcut-dot"></div>
        <span class="shortcut-name">Wikipedia</span>
      </a>
      <a class="shortcut-card" href="https://stackoverflow.com">
        <div class="shortcut-dot"></div>
        <span class="shortcut-name">Stack Overflow</span>
      </a>
      <a class="shortcut-card" href="https://mail.google.com">
        <div class="shortcut-dot"></div>
        <span class="shortcut-name">Gmail</span>
      </a>
    </div>
  </div>

  <script>
    // Live Clock & Date
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('live-clock').textContent = `${hours}:${minutes}`;

      const options = { weekday: 'long', month: 'long', day: 'numeric' };
      document.getElementById('live-date').textContent = now.toLocaleDateString('en-US', options);
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Search Engine Selection (Default: Google)
    let currentEngine = 'google';
    const engineUrls = {
      google: 'https://www.google.com/search?q=',
      youtube: 'https://www.youtube.com/results?search_query=',
      github: 'https://github.com/search?q=',
      reddit: 'https://www.reddit.com/search/?q=',
      duckduckgo: 'https://duckduckgo.com/?q='
    };

    document.querySelectorAll('.engine-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.engine-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentEngine = pill.dataset.engine;
        document.getElementById('search-input').placeholder = `Search ${pill.textContent} or enter address...`;
        document.getElementById('search-input').focus();
      });
    });

    // Form Navigation
    document.getElementById('search-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;

      if (/^https?:\/\//i.test(query)) {
        window.location.href = query;
      } else if (/^[a-zA-Z0-9-]+\.[a-zA-Z]{2,}(\/.*)?$/.test(query)) {
        window.location.href = 'https://' + query;
      } else {
        const base = engineUrls[currentEngine] || engineUrls.google;
        window.location.href = base + encodeURIComponent(query);
      }
    });
  </script>
</body>
</html>
